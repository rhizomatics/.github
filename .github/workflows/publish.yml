# This workflow builds the Zensical site and publishes it to GitHub Pages
# See: https://zensical.org/docs/publish-your-site/

name: Github Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
    - uses: actions/configure-pages@v6
    - name: Install dependencies
      run: uv sync --locked
    - name: Build site
      run: uv run zensical build --clean
    - uses: actions/upload-pages-artifact@v5
      with:
        path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - uses: actions/deploy-pages@v5
      id: deployment
