# Dependency updates. Shape shared across rhizomatics repos: see templates/README.md in rhizomatics/.github.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
